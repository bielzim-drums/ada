<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 900" width="1200" height="900">
  <!-- Mesa de ceia: bolo tronco de chocolate, velas acesas, taças, pratos e ramos de pinheiro -->
  <defs>
    <radialGradient id="fundoM" cx="0.5" cy="0.4" r="0.8"><stop offset="0" stop-color="#3a1a18"/><stop offset="1" stop-color="#140808"/></radialGradient>
    <linearGradient id="toalha" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#B3202A"/><stop offset="1" stop-color="#6e1018"/></linearGradient>
    <linearGradient id="trilho" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#FBF6EA"/><stop offset="1" stop-color="#e6dbc0"/></linearGradient>
    <linearGradient id="tronco" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#6b3b1f"/><stop offset="0.6" stop-color="#4a2512"/><stop offset="1" stop-color="#2e160a"/></linearGradient>
    <radialGradient id="corte" cx="0.5" cy="0.5" r="0.5"><stop offset="0" stop-color="#f3e3c3"/><stop offset="0.3" stop-color="#5a2e16"/><stop offset="0.55" stop-color="#f3e3c3"/><stop offset="0.8" stop-color="#5a2e16"/><stop offset="1" stop-color="#3a1c0c"/></radialGradient>
    <linearGradient id="vela" x1="0" y1="0" x2="1" y2="0"><stop offset="0" stop-color="#f6efe0"/><stop offset="0.5" stop-color="#ffffff"/><stop offset="1" stop-color="#e0d5bd"/></linearGradient>
    <radialGradient id="chama" cx="0.5" cy="0.7" r="0.6"><stop offset="0" stop-color="#fffbe0"/><stop offset="0.5" stop-color="#ffd34e"/><stop offset="1" stop-color="#ff8a2a"/></radialGradient>
    <radialGradient id="aura" cx="0.5" cy="0.5" r="0.5"><stop offset="0" stop-color="#ffd877" stop-opacity="0.55"/><stop offset="1" stop-color="#ffd877" stop-opacity="0"/></radialGradient>
    <linearGradient id="ouroM" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#FFE9A0"/><stop offset="0.5" stop-color="#E9C95A"/><stop offset="1" stop-color="#A9811A"/></linearGradient>
    <radialGradient id="prato" cx="0.5" cy="0.4" r="0.6"><stop offset="0" stop-color="#ffffff"/><stop offset="1" stop-color="#d9dde4"/></radialGradient>
